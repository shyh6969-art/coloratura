<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>קולורטורה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e8e5da; --surface:#f4f2e9; --surface-2:#ddd9c9;
    --ink:#201c2a; --ink-soft:#5a5568; --ink-faint:#8b869a;
    --pigment:#ac3a2a; --tone:#33487d; --line:#c9c2ac; --line-strong:#a89f85;
    --font-display:'Frank Ruhl Libre',Georgia,serif;
    --font-body:'IBM Plex Sans Hebrew','Segoe UI',sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#161520; --surface:#1e1c28; --surface-2:#282533;
      --ink:#ece8e0; --ink-soft:#a49db4; --ink-faint:#726c85;
      --pigment:#e28066; --tone:#8598d9; --line:#37334a; --line-strong:#4a4560;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:var(--font-body); line-height:1.6;
  }
  .wrap{max-width:720px; margin:0 auto; padding:48px 24px 80px;}
  h1{
    font-family:var(--font-display); font-weight:700;
    font-size:clamp(2.2rem,6vw,3rem); margin:0 0 4px;
    background:linear-gradient(90deg,var(--pigment),var(--tone));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .subtitle{color:var(--ink-soft); font-family:var(--font-display); font-style:italic; margin:0 0 40px;}

  #dropzone{
    border:2px dashed var(--line-strong); border-radius:12px; background:var(--surface);
    padding:48px 24px; text-align:center; cursor:pointer; transition:border-color .15s, background .15s;
  }
  #dropzone.drag{border-color:var(--tone); background:var(--surface-2);}
  #dropzone p{margin:0; color:var(--ink-soft);}
  #dropzone .hint{font-family:var(--font-mono); font-size:0.8rem; color:var(--ink-faint); margin-top:8px;}
  #fileInput{display:none;}

  #preview{max-width:200px; max-height:200px; border-radius:8px; margin:0 auto 16px; display:block;}

  #status{
    display:none; text-align:center; padding:32px; color:var(--ink-soft);
    font-family:var(--font-mono); font-size:0.9rem;
  }
  .spinner{
    width:28px; height:28px; margin:0 auto 16px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--pigment);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  #error{
    display:none; background:var(--surface); border:1px solid var(--pigment);
    border-inline-start:3px solid var(--pigment); border-radius:8px; padding:16px;
    color:var(--pigment); margin-top:16px;
  }

  #results{display:none; margin-top:32px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:16px;}
  .vat-row{display:grid; grid-template-columns:110px 1fr 46px; align-items:center; gap:12px; margin-bottom:10px;}
  .vat-row:last-child{margin-bottom:0;}
  .vat-row .name{font-family:var(--font-mono); font-size:0.78rem; color:var(--ink-soft);}
  .vat-row .track{height:9px; background:var(--surface-2); border-radius:5px; overflow:hidden; border:1px solid var(--line);}
  .vat-row .fill{height:100%; background:linear-gradient(90deg,var(--tone),var(--pigment));}
  .vat-row .val{font-family:var(--font-mono); font-size:0.78rem; color:var(--ink-faint); font-variant-numeric:tabular-nums;}

  .fields{display:grid; grid-template-columns:1fr 1fr; gap:10px 20px; font-size:0.92rem;}
  .fields dt{font-family:var(--font-mono); font-size:0.72rem; color:var(--ink-faint); margin-bottom:2px;}
  .fields dd{margin:0 0 10px;}
  .fields{margin:0;}

  audio{width:100%; margin-top:8px;}

  .download-link{
    font-family:var(--font-mono); font-size:0.78rem; color:var(--tone);
    text-decoration:none; border:1px solid var(--line-strong); border-radius:6px;
    padding:4px 10px; transition:border-color .15s, background .15s;
  }
  .download-link:hover{border-color:var(--tone); background:var(--surface-2);}

  .style-bar-row{display:flex; align-items:center; gap:10px; margin-bottom:6px; font-size:0.85rem;}
  .style-bar-row .label{width:150px; flex:none; color:var(--ink-soft);}
  .style-bar-row .track{flex:1; height:7px; background:var(--surface-2); border-radius:4px; overflow:hidden; border:1px solid var(--line);}
  .style-bar-row .fill{height:100%; background:var(--tone);}
  .style-bar-row .pct{font-family:var(--font-mono); font-size:0.75rem; color:var(--ink-faint); width:36px; text-align:left;}

  button.reset{
    display:block; margin:24px auto 0; background:none; border:1px solid var(--line-strong);
    color:var(--ink-soft); border-radius:8px; padding:8px 20px; font-family:var(--font-mono);
    font-size:0.85rem; cursor:pointer;
  }
  button.reset:hover{border-color:var(--tone); color:var(--tone);}
</style>
</head>
<body>
<div class="wrap">
  <h1>קולורטורה</h1>
  <p class="subtitle">מציור למוזיקה — דרגה A (חינם, מיידי)</p>

  <div id="dropzone">
    <p><strong>גררו ציור לכאן</strong> או לחצו לבחירה</p>
    <p class="hint">JPG / PNG / WEBP · עד 15MB</p>
    <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.webp">
  </div>

  <div id="status">
    <div class="spinner"></div>
    <p id="statusText">מנתח תכונות חזותיות…</p>
  </div>

  <div id="error"></div>

  <div id="results">
    <img id="preview" alt="">

    <div class="card">
      <div class="vat-row"><span class="name">ערכיות</span><div class="track"><div class="fill" id="bar-valence"></div></div><span class="val" id="val-valence"></span></div>
      <div class="vat-row"><span class="name">עוררות</span><div class="track"><div class="fill" id="bar-arousal"></div></div><span class="val" id="val-arousal"></span></div>
      <div class="vat-row"><span class="name">מתח פורמלי</span><div class="track"><div class="fill" id="bar-tf"></div></div><span class="val" id="val-tf"></span></div>
      <div class="vat-row"><span class="name">מתח רגשי</span><div class="track"><div class="fill" id="bar-te"></div></div><span class="val" id="val-te"></span></div>
    </div>

    <div class="card">
      <dl class="fields">
        <div><dt>סולם/מודוס</dt><dd id="f-key"></dd></div>
        <div><dt>טמפו</dt><dd id="f-tempo"></dd></div>
        <div><dt>מטר</dt><dd id="f-meter"></dd></div>
        <div><dt>צורה</dt><dd id="f-form"></dd></div>
        <div><dt>מורכבות הרמונית</dt><dd id="f-complexity"></dd></div>
        <div><dt>רזולוציה</dt><dd id="f-resolution"></dd></div>
        <div><dt>תזמור</dt><dd id="f-instrumentation"></dd></div>
        <div><dt>ארטיקולציה</dt><dd id="f-articulation"></dd></div>
      </dl>
    </div>

    <div class="card">
      <dt style="font-family:var(--font-mono); font-size:0.72rem; color:var(--ink-faint); margin-bottom:10px;">סיווג סגנון</dt>
      <div id="style-bars"></div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <dt style="font-family:var(--font-mono); font-size:0.72rem; color:var(--ink-faint);">שמע</dt>
        <a id="downloadLink" href="#" download class="download-link">⭳ הורדת WAV</a>
      </div>
      <audio id="player" controls></audio>
    </div>

    <button class="reset" id="resetBtn">ציור אחר</button>
  </div>
</div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');
const errorEl = document.getElementById('error');
const resultsEl = document.getElementById('results');

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) handleFile(fileInput.files[0]);
});
document.getElementById('resetBtn').addEventListener('click', () => {
  resultsEl.style.display = 'none';
  dropzone.style.display = 'block';
  errorEl.style.display = 'none';
  fileInput.value = '';
});

async function handleFile(file) {
  errorEl.style.display = 'none';
  resultsEl.style.display = 'none';
  dropzone.style.display = 'none';
  statusEl.style.display = 'block';

  const preview = document.getElementById('preview');
  preview.src = URL.createObjectURL(file);

  const form = new FormData();
  form.append('file', file);

  try {
    const res = await fetch('/api/analyze', { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'שגיאה לא ידועה');
    render(data);
  } catch (err) {
    statusEl.style.display = 'none';
    dropzone.style.display = 'block';
    errorEl.textContent = 'שגיאה: ' + err.message;
    errorEl.style.display = 'block';
  }
}

function pct(x) { return Math.round(x * 100) + '%'; }

function render(data) {
  const b = data.brief;
  statusEl.style.display = 'none';
  resultsEl.style.display = 'block';

  const vat = b.vat;
  setBar('valence', vat.valence);
  setBar('arousal', vat.arousal);
  setBar('tf', vat.tension_formal);
  setBar('te', vat.tension_emotional);

  document.getElementById('f-key').textContent = b.key;
  document.getElementById('f-tempo').textContent = b.tempo_bpm + ' BPM';
  document.getElementById('f-meter').textContent = b.meter;
  document.getElementById('f-form').textContent = b.form;
  document.getElementById('f-complexity').textContent = b.harmonic_complexity;
  document.getElementById('f-resolution').textContent = b.harmonic_resolution;
  document.getElementById('f-instrumentation').textContent = b.instrumentation.join('، ');
  document.getElementById('f-articulation').textContent = b.articulation;

  const styleBars = document.getElementById('style-bars');
  styleBars.innerHTML = '';
  const scores = b.engine_notes.style_semantic_scores || {};
  const sorted = Object.entries(scores).sort((a, c) => c[1] - a[1]);
  for (const [name, val] of sorted) {
    const row = document.createElement('div');
    row.className = 'style-bar-row';
    row.innerHTML = `<span class="label">${name}</span><div class="track"><div class="fill" style="width:${pct(val)}"></div></div><span class="pct">${pct(val)}</span>`;
    styleBars.appendChild(row);
  }

  document.getElementById('player').src = data.audio_url;

  const stem = (b.source_image || 'ציור').replace(/\.[^.]+$/, '').replace(/[^\w֐-׿-]+/g, '_');
  const dl = document.getElementById('downloadLink');
  dl.href = data.audio_url;
  dl.download = `${stem}-coloratura.wav`;
}

function setBar(prefix, value) {
  document.getElementById('bar-' + prefix).style.width = pct(value);
  document.getElementById('val-' + prefix).textContent = value.toFixed(2);
}
</script>
</body>
</html>
